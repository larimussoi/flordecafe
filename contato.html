<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contato | Flor de Café</title>

    <link rel="stylesheet" href="style.css" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img
            src="img/flordecafe.svg"
            width="120"
            class="me-2"
            alt="Logo Flor de Café"
          />
        </a>

    <header class="py-5 text-center bg-light">
      <div class="container">
        <h1 class="display-5 fw-bold">Entre em Contato</h1>
        <p class="text-muted">Estamos esperando sua visita</p>
      </div>
    </header>

    <section class="container my-5">
      <div class="row g-5">
        <div class="col-12 col-md-5">
          <h4 class="fw-bold mb-4">Nossa Loja</h4>

          <p>
            <strong>📍 Endereço:</strong><br />
            Rua das Flores, 123<br />
            Centro – São Paulo, SP
          </p>

          <p>
            <strong>📞 Telefone:</strong><br />
            (11) 99999-9999
          </p>

          <p>
            <strong>🕒 Horário:</strong><br />
            Segunda a Sábado: 8h às 20h<br />
            Domingo: 9h às 14h
          </p>

          <a href="index.html" class="btn-voltar mt-3">
            ← Voltar ao cardápio
          </a>
        </div>

        <div class="col-12 col-md-7">
          <div class="mapa-container shadow-sm rounded-4 overflow-hidden">
            <iframe
              src="https://www.google.com/maps?q=São+Paulo&output=embed"
              width="100%"
              height="400"
              style="border: 0"
              allowfullscreen=""
              loading="lazy"
            >
            </iframe>
          </div>
        </div>
      </div>
    </section>

    <footer class="text-center py-4 bg-light">
      <p class="mb-0">
        2025 © Flor de Café | Projeto fictício sem fins comerciais
      </p>
    </footer>
  </body>
</html>
